[project]
name = "preprocessor"
version = "0.2.0"
description = "CAMBioMed toolbox for benthic images."
keywords = [ "benthic", "images", "toolbox" ]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  {name = "Daniel A. A. Pelsmaeker", email = "developer@pelsmaeker.net"},
]
maintainers = [
  {name = "Daniel A. A. Pelsmaeker", email = "developer@pelsmaeker.net"},
]
requires-python = ">=3.12"

dependencies = [
  "click>=8.3.1",
  "exifread>=3.5.1",
  "numpy<2.3.0",  # For NumPy version that works with OpenCV
  "opencv-contrib-python-headless==4.12.0.88",  # For OpenCV version that works on MacOS
  "pillow>=12.1.1",
  "pydantic>=2.12.5",
  "PySide6-Essentials>=6.10.2",
  "qimage2ndarray>=1.10.0",
  "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
torch = [
  # Not MacOS Intel compatible:
  "torch>=2.14; sys_platform == 'linux'",
  "torchvision>=0.29; sys_platform == 'linux'",
]


[dependency-groups]
# NOTE: This list must be kept in sync with `tool.briefcase.app.preprocessor.test_requires` test dependencies.
# Please update both lists when adding/removing dependencies, until UV is supported by Briefcase.
# Test dependencies
test = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-qt>=4.5.0",
]
dev = [
  # Build dependencies
  "hatch>=1.16.5",
  "hatchling>=1.29.0",
  # Development dependencies
  "briefcase>=0.4.6",
  "mypy>=1.19.1",
  "ruff>=0.15.20",
  "tox-uv>=1.37.0",
  "tox>=4.65.4",
  "ty>=0.0.43",
]


######
# UV #
######

[tool.uv]
python-preference = "only-managed"
default-groups = "all"


###########
# Scripts #
###########
# CLI launcher
[project.scripts]
preprocessor = "preprocessor.main:main"

# For Windows GUI launcher (no console)
[project.gui-scripts]
preprocessor-gui = "preprocessor.main:main_gui"


################
# Project URLs #
################

[project.urls]
Homepage = "https://cambiomed-biodiversa.com/"
Documentation = "https://cambiomed-biodiversa.com/preprocessor/"
Repository = "https://github.com/CAMBioMed/preprocessor.git"
Source = "https://github.com/CAMBioMed/preprocessor/"
Issues = "https://github.com/CAMBioMed/preprocessor/issues"
Changelog = "https://github.com/CAMBioMed/preprocessor/blob/main/CHANGELOG.md"


################
# Build System #
################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/preprocessor",
]


##########
# PyTest #
##########

[tool.pytest.ini_options]
strict = true
minversion = "9.0"
addopts = [
  "-ra",                        # Show all outcomes except passed
  "--showlocals",               # Show locals in tracebacks
  "--import-mode=importlib",    # Use importlib to import test modules
  "--strict",                   # Fail on warnings and unknown markers
  "--cov",                      # Measure coverage using [tool.coverage.run]
  "--cov-report=term-missing",  # Show missing lines in terminal
]
filterwarnings = [
  "error",  # Warnings as errors
  "ignore::DeprecationWarning:PySide6",  # Qt internal deprecations — not ours
]
log_cli = true
log_cli_level = "INFO"
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]


############
# Coverage #
############

[tool.coverage.run]
source_pkgs = ["preprocessor"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  'pragma: no cover',
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]


#######
# Tox #
#######

[tool.tox]
envlist = [
  "3.12",
  "lint",
]

[tool.tox.env_run_base]
description = "run the test suite with pytest"
dependency_groups = ["test"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.env.lint]
description = "run linters"
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", { replace = "posargs", default = ["."], extend = true }]]


########
# MyPy #
########

[tool.mypy]
warn_return_any = true
disallow_untyped_defs = true
exclude_gitignore = true
exclude = [
    '(^|/)ui_.*\.py$',
]

# PyTorch is intentionally omitted on non-Linux platforms; torchvision does not
# ship type stubs (no `py.typed` marker).
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# Generated by pyside6-uic; these files are replaced by `mise run build-ui`.
[[tool.mypy.overrides]]
module = [
  "preprocessor.gui.designer.*",
]
ignore_errors = true


########
# ty   #
########

[tool.ty.environment]
# Source and test packages are both checked; tests import helpers through the
# repository-root `tests` package.
root = ["./src", "."]
python-version = "3.12"

[tool.ty.rules]
# Keep correctness failures fatal.
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-return-type = "error"
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"

# Useful, but less important than correctness failures.
unused-ignore-comment = "warn"

# Generated Qt modules are excluded below rather than weakening production code.
[[tool.ty.overrides]]
include = ["src/preprocessor/gui/designer/ui_*.py"]

[tool.ty.overrides.rules]
all = "ignore"


#############################
# Ruff Linting & Formatting #
#############################

[tool.ruff]
line-length = 120
extend-exclude = [
  "ui_*.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
]
extend-select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "D2",
  "D3",
  "D4",
  "E501",
  "EM",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
]
ignore = [
  "D202",
  "D205",
  "D401",
  "S101",
]
pydocstyle.convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests can ignore a few extra rules
"tests/**" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "ARG001",
  "ARG002",
  "ARG004",
  "ARG005",
  "EM",
  "INP001",
  "PLC0415",
]
"tests/preprocessor/core/transform/test_perspective_crop_transform.py" = [
  "S108",
]
"tests/preprocessor/core/transform/test_lens_correct_transform.py" = [
  "S108",
]
"tests/preprocessor/core/transform/test_transform_image.py" = [
  "S108",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true


###########
# YamlFix #
###########
[tool.yamlfix]
line_length = 120
sequence_style = "keep_style"
explicit_start = false
whitelines = 1
section_whitelines = 1


##############
# Qt Creator #
##############
[tool.pyside6-project]
files = [
    "src/preprocessor/__main__.py",
    "src/preprocessor/gui/designer/apply_parameters_dialog.ui",
    "src/preprocessor/gui/designer/editor_dock.ui",
    "src/preprocessor/gui/designer/hsv_threshold.ui",
    "src/preprocessor/gui/designer/launch_dialog.ui",
    "src/preprocessor/gui/designer/main_window.ui",
    "src/preprocessor/gui/designer/metadata_dialog.ui",
    "src/preprocessor/gui/designer/progress_dialog.ui",
    "src/preprocessor/gui/designer/project_settings_dialog.ui",
    "src/preprocessor/gui/designer/properties_dock.ui",
    "src/preprocessor/gui/designer/tree_dock.ui",
]


#############
# Briefcase #
#############
[tool.briefcase]
project_name = "preprocessor"
bundle = "com.cambiomed-biodiversa"
author = "Daniel A. A. Pelsmaeker"
author_email = "developer@pelsmaeker.net"

[tool.briefcase.app.preprocessor]
formal_name = "CAMBioMed Preprocessor"
long_description = """Preprocessor application for benthic photos."""
icon = "appicon/preprocessor"
splash_background_color = "#a95e43"
sources = [
    "src/preprocessor",
]
test_sources = [
    "tests",
]

requires = [
    # Add your cross-platform app requirements here
]
# NOTE: This list must be kept in sync with `dependency-groups.test` test dependencies.
# Please update both lists when adding/removing dependencies, until UV is supported by Briefcase.
# See also: https://github.com/beeware/briefcase/issues/1235
test_requires = [
  # Test dependencies
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-qt>=4.5.0",
]

[tool.briefcase.app.preprocessor.macOS]
# WORKAROUND: https://github.com/beeware/briefcase/issues/2658#issuecomment-3832236695
min_os_version = "13.0"
universal_build = true      # Support both x86_64/ARM64
requires = [
    "std-nslog>=2.0.0,<3.0.0",
]

[tool.briefcase.app.preprocessor.linux]
requires = []

[tool.briefcase.app.preprocessor.linux.system.debian]
system_requires = []

system_runtime_requires = [
    # Derived from https://doc.qt.io/qt-6/linux-requirements.html
    "libxext6",
    "libxrender1",
    "libx11-xcb1",
    "libxkbcommon-x11-0",
    "libxcb-image0",
    "libxcb-cursor0",
    "libxcb-shape0",
    "libxcb-randr0",
    "libxcb-xfixes0",
    "libxcb-sync1",
    "libxcb-icccm4",
    "libxcb-keysyms1",
    "libfontconfig1",
    "libsm6",
    "libice6",
    "libglib2.0-0",
    "libgl1",
    "libegl1",
    "libdbus-1-3",
]

[tool.briefcase.app.preprocessor.linux.system.rhel]
system_requires = []

system_runtime_requires = [
    "qt6-qtbase-gui",
]

[tool.briefcase.app.preprocessor.linux.system.suse]
system_requires = []

system_runtime_requires = [
    "libgthread-2_0-0",
    "libQt6Gui6",
]

[tool.briefcase.app.preprocessor.linux.system.arch]
system_requires = []

system_runtime_requires = [
    "qt6-base",
]

[tool.briefcase.app.preprocessor.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
# ?? FIXME
]

linuxdeploy_plugins = [
]

[tool.briefcase.app.preprocessor.linux.flatpak]
flatpak_runtime = "org.kde.Platform"
flatpak_runtime_version = "6.9"
flatpak_sdk = "org.kde.Sdk"

[tool.briefcase.app.preprocessor.windows]
requires = []

# Mobile deployments
[tool.briefcase.app.preprocessor.iOS]
supported = false

[tool.briefcase.app.preprocessor.android]
supported = false

# Web deployments
[tool.briefcase.app.preprocessor.web]
supported = false
